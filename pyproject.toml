[project]
name = "ksei"
version = "0.4.0"
description = "A Python client and Model Context Protocol (MCP) server for AKSes KSEI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "nichsedge"}]
keywords = ["ksei", "indonesia", "securities", "mcp", "model-context-protocol", "finance", "depository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nichsedge/ksei"
Documentation = "https://github.com/nichsedge/ksei#readme"
Repository = "https://github.com/nichsedge/ksei.git"
"Bug Tracker" = "https://github.com/nichsedge/ksei/issues"

[project.scripts]
ksei = "ksei.cli:main"
ksei-mcp = "ksei.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
